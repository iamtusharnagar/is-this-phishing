<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Is This Phishing?</title>
<style>
  :root {
    --paper: #FAF7F2;
    --ink: #232B2B;
    --ink-soft: #4B5555;
    --amber: #B8722C;
    --amber-bg: #FBF0E1;
    --sage: #4B7C63;
    --sage-bg: #EDF3EE;
    --rule: #DDD6C8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    width: 360px;
    background: var(--paper);
    color: var(--ink);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 14px;
    line-height: 1.5;
  }
  .wrap { padding: 18px; }
  h1 {
    font-size: 1.05rem;
    margin: 0 0 12px;
    font-family: ui-serif, Georgia, serif;
  }
  .verdict {
    padding: 14px 16px;
    border-radius: 4px;
    font-weight: 600;
    margin-bottom: 14px;
  }
  .verdict.caution { background: var(--amber-bg); color: #6B4118; border-left: 4px solid var(--amber); }
  .verdict.clear { background: var(--sage-bg); color: #2E4E3E; border-left: 4px solid var(--sage); }
  .verdict p { margin: 6px 0 0; font-weight: 400; font-size: 0.92rem; }
  .finding { padding: 10px 0 10px 12px; border-left: 3px solid var(--amber); margin-bottom: 2px; }
  .finding + .finding { border-top: 1px solid var(--rule); }
  .finding-label { font-weight: 600; margin: 0 0 4px; font-size: 0.95rem; }
  .finding-explanation { margin: 0; color: var(--ink-soft); font-size: 0.88rem; }
  .meta { color: var(--ink-soft); font-size: 0.85rem; word-break: break-all; margin-bottom: 14px; }
  footer { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--rule); font-size: 0.82rem; color: var(--ink-soft); }
</style>
</head>
<body>
<div class="wrap">
  <h1>Is This Phishing?</h1>
  <div id="meta" class="meta"></div>
  <div id="content">Checking this page…</div>
  <footer>Checked entirely on your device. Nothing about this page is ever sent anywhere.</footer>
</div>
<script src="popup.js"></script>
</body>
</html>
